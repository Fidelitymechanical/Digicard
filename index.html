<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Martín Pérez | Fidelity Mechanical Solutions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  body {
    font-family:'Inter',sans-serif;
    background: linear-gradient(145deg, #0f0c29, #1a1060, #24243e);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* ── Header Banner ── */
  .header {
    background: linear-gradient(135deg, #1E1B4B 0%, #2D1F6E 40%, #1D4ED8 100%);
    padding: 36px 28px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content:'';
    position:absolute;
    bottom:-30px; right:-30px;
    width:180px; height:180px;
    border-radius:50%;
    background: rgba(99,102,241,0.15);
  }
  .header::before {
    content:'';
    position:absolute;
    top:-40px; right:60px;
    width:120px; height:120px;
    border-radius:50%;
    background: rgba(139,92,246,0.1);
  }

  /* ── Logo Mark ── */
  .logo-wrap {
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    position:relative;
    z-index:2;
  }
  .logo-icon {
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:flex-start;
  }
  .bar {
    height:7px;
    border-radius:2px;
    transform: skewX(-12deg);
  }
  .bar1 { width:32px; background:#7C3AED; }
  .bar2 { width:42px; background:#4338CA; }
  .bar3 { width:54px; background:#2563EB; }

  .logo-text { display:flex; flex-direction:column; }
  .logo-name {
    font-size:18px;
    font-weight:900;
    letter-spacing:3px;
    color:#ffffff;
    line-height:1;
  }
  .logo-sub {
    font-size:7.5px;
    font-weight:400;
    letter-spacing:3px;
    color:#A5B4FC;
    margin-top:4px;
  }
  .logo-divider {
    width:1px;
    height:36px;
    background:rgba(165,180,252,0.35);
    margin: 0 4px;
  }

  /* ── Name Block ── */
  .name-block { position:relative; z-index:2; }
  .person-name {
    font-size:28px;
    font-weight:700;
    color:#ffffff;
    letter-spacing:0.5px;
    line-height:1.1;
  }
  .person-title {
    font-size:10px;
    font-weight:600;
    letter-spacing:3.5px;
    color:#818CF8;
    margin-top:6px;
    text-transform:uppercase;
  }

  /* ── Tag line strip ── */
  .tagline-strip {
    background: linear-gradient(90deg, #4338CA, #7C3AED);
    padding: 10px 28px;
    font-size:9px;
    font-weight:600;
    letter-spacing:3px;
    color:#E0E7FF;
    text-transform:uppercase;
  }

  /* ── Contact Section ── */
  .contact {
    padding: 28px 28px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .contact-item {
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    border-radius:12px;
    text-decoration:none;
    transition:background 0.2s;
    cursor:pointer;
  }
  .contact-item:hover { background:#F5F3FF; }

  .icon-wrap {
    width:38px; height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon-phone { background:linear-gradient(135deg,#4338CA,#6D28D9); }
  .icon-email { background:linear-gradient(135deg,#1D4ED8,#4338CA); }
  .icon-web   { background:linear-gradient(135deg,#6D28D9,#7C3AED); }

  .icon-wrap svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .contact-details { display:flex; flex-direction:column; }
  .contact-label { font-size:9px; font-weight:600; letter-spacing:2px; color:#9CA3AF; text-transform:uppercase; }
  .contact-value { font-size:14px; font-weight:600; color:#1E1B4B; margin-top:1px; }

  /* ── Save Button ── */
  .save-wrap { padding:20px 28px 28px; }
  .save-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#1E1B4B,#2563EB);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    border:none;
    cursor:pointer;
    text-decoration:none;
    transition:opacity 0.2s, transform 0.1s;
  }
  .save-btn:hover { opacity:0.9; transform:translateY(-1px); }
  .save-btn svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  /* ── Footer ── */
  .footer {
    border-top:1px solid #EEF2FF;
    padding:14px 28px;
    text-align:center;
    font-size:9px;
    letter-spacing:2px;
    color:#C7D2FE;
    font-weight:500;
    background:#FAFAFA;
    text-transform:uppercase;
  }
</style>
</head>
